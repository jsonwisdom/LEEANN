name: JayTree Backward Sync Audit

on:
  workflow_dispatch:
  schedule:
    # 06:37 UTC is after local midnight in Alabama in both CST and CDT.
    - cron: '37 6 * * *'
  push:
    branches: [master]
    paths:
      - 'docs/jaytree/**'
      - 'receipts/jaytree/**'
      - 'tools/jaytree_*'
      - '.github/workflows/jaytree-backward-sync.yml'

permissions:
  contents: write

concurrency:
  group: jaytree-backward-sync
  cancel-in-progress: false

jobs:
  leeann-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate LEEANN JayTree receipt
        run: |
          set -euo pipefail
          python tools/jaytree_backward_sync_v0_1.py \
            --out build/jaytree/JAYTREE_LEEANN_RECEIPT.json

      - name: Validate constitutional fields
        run: |
          python - <<'PY'
          import json
          p='build/jaytree/JAYTREE_LEEANN_RECEIPT.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='JAYTREE_BACKWARD_SYNC_RECEIPT_V0_1'
          assert d['authority_created'] is False
          ids=[w['window_id'] for w in d['windows']]
          assert ids==['TODAY','YESTERDAY','LAST_7_DAYS','LAST_30_DAYS','LAST_3_YEARS']
          assert d['receipt_sha256']
          print('JAYTREE_LEEANN_RECEIPT=PASS')
          PY

      - name: Prepare RYZEN5 pull surface
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('build/jaytree/JAYTREE_LEEANN_RECEIPT.json')
          d=json.loads(src.read_text(encoding='utf-8'))
          d['receipt_head_role']='HEAD_BEFORE_STATUS_COMMIT'
          d['delivery_surface']='docs/jaytree-status.json'
          d['local_machine_claim']='PENDING_GIT_PULL_RECEIPT'
          Path('docs/jaytree-status.json').write_text(json.dumps(d, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Inventory JSONWisdom estate
        env:
          # Optional and deliberately scoped. Without it, coverage is PUBLIC_ONLY.
          JAYTREE_ESTATE_TOKEN: ${{ secrets.JAYTREE_ESTATE_TOKEN }}
        run: |
          set -euo pipefail
          python tools/jaytree_estate_inventory_v0_1.py \
            --owner jsonwisdom \
            --out build/jaytree/JSONWISDOM_ESTATE_INVENTORY.json

      - name: Report estate coverage ceiling
        run: |
          python - <<'PY'
          import json
          p='build/jaytree/JSONWISDOM_ESTATE_INVENTORY.json'
          d=json.load(open(p, encoding='utf-8'))
          print('coverage=', d['coverage'])
          print('repo_count_observed=', d['repo_count_observed'])
          print('private_coverage_claim=', d['private_coverage_claim'])
          assert d['authority_created'] is False
          if d['coverage']=='PUBLIC_ONLY':
              print('PRIVATE_REPO_SCAN=GAP_AUTH_SCOPE')
          PY

      - name: Commit machine-readable JayTree status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JayTree Sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jaytree-status.json
          if git diff --cached --quiet; then
            echo "JayTree status unchanged."
          else
            git commit -m "chore: refresh JayTree backward sync receipt"
            git push origin HEAD:master
          fi

      - name: Upload JayTree receipts
        uses: actions/upload-artifact@v4
        with:
          name: jaytree-backward-sync-${{ github.run_id }}
          path: build/jaytree/*.json
          if-no-files-found: error
          retention-days: 30
