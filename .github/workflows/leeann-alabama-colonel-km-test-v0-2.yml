name: LeeAnn Alabama Colonel KM Test v0.2

on:
  push:
    branches:
      - feature/protocol-one-harness
    paths:
      - 'fixtures/leeann/ALABAMA_COLONEL_KM_FROZEN_PACKET_V0_2.json'
      - 'fixtures/leeann/ALABAMA_COLONEL_KM_TEST_MANIFEST_V0_2.json'
      - 'tests/leeann/test_alabama_colonel_km_v0_2.py'
      - '.github/workflows/leeann-alabama-colonel-km-test-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alabama-colonel-km-v0-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "expected=${GITHUB_SHA}"
          echo "actual=${ACTUAL}"
          test "${ACTUAL}" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run corrected Alabama Colonel Test
        run: |
          set -euo pipefail
          python tests/leeann/test_alabama_colonel_km_v0_2.py \
            --manifest fixtures/leeann/ALABAMA_COLONEL_KM_TEST_MANIFEST_V0_2.json \
            --out build/receipts/ALABAMA_COLONEL_KM_TEST_V0_2.json

      - name: Print receipt
        if: always()
        run: |
          if [ -f build/receipts/ALABAMA_COLONEL_KM_TEST_V0_2.json ]; then
            cat build/receipts/ALABAMA_COLONEL_KM_TEST_V0_2.json
          fi

      - name: Add summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('build/receipts/ALABAMA_COLONEL_KM_TEST_V0_2.json')
          if not p.exists():
              raise SystemExit(0)
          r = json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Alabama Colonel KM Test v0.2\n\n')
              f.write(f"- Status: **{r['status']}**\n")
              f.write(f"- Deterministic byte mechanics: **{r['summary']['deterministic_byte_mechanics']}**\n")
              f.write(f"- Invariants: **{r['summary']['invariants']}**\n")
              f.write(f"- Live sources observed: **{r['summary']['live_sources_observed']} / {r['summary']['live_source_count']}**\n")
              f.write(f"- Environmental HOLDs: **{r['summary']['environmental_holds']}**\n")
              f.write(f"- Source endpoint failures: **{r['summary']['source_endpoint_failures']}**\n")
              f.write('- One-byte controlled transition: **REPLAYED**\n')
              f.write('- Facts promoted: **0**\n')
              f.write('- Authority created: **false**\n')

      - name: Upload v0.2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeann-alabama-colonel-km-test-v0-2-receipt
          path: build/receipts/ALABAMA_COLONEL_KM_TEST_V0_2.json
          if-no-files-found: error
